name: release

on:
  push:
    tags: ['v*']
 
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Setup conda (mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
          use-mamba: true
          miniforge-version: latest

      - name: Install Essentia (conda-forge first, pip fallback)
        shell: bash -l {0}
        run: |
          set -euo pipefail

          conda env remove -n essenv >/dev/null 2>&1 || true

          for PY in 3.9 3.10 3.8; do
            echo "::group::conda-forge essentia on python=${PY}"
            if mamba create -y -n essenv -c conda-forge "python=${PY}"; then
              conda activate essenv
              if mamba install -y -c conda-forge essentia; then
                python - <<'PY'
                import essentia, sys
                print("essentia via conda OK", getattr(essentia, "__version__", "?"), "python", sys.version)
                PY
                echo "CONDA_ENV=essenv" >> "$GITHUB_ENV"
                echo "::endgroup::"
                exit 0
              fi
            fi
            conda deactivate >/dev/null 2>&1 || true
            conda env remove -n essenv >/dev/null 2>&1 || true
            echo "::endgroup::"
          done

          echo "::group::pip fallback build"
          mamba create -y -n essenv -c conda-forge python=3.10 cmake numpy cython pkg-config
          conda activate essenv
          sudo apt-get update
          sudo apt-get install -y build-essential libfftw3-dev libsamplerate0-dev libyaml-dev \
                               libavcodec-dev libavformat-dev libavutil-dev
          python -m pip install -U pip setuptools wheel
          pip install essentia
          python - <<'PY'
          import essentia, sys
          print("essentia via pip OK", getattr(essentia, "__version__", "?"), "python", sys.version)
          PY
          echo "CONDA_ENV=essenv" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Bootstrap (min)
        shell: bash -l {0}
        run: conda activate "$CONDA_ENV" && ./scripts/bootstrap.sh

      - name: Install deps & Test
        run: |
          npm ci
          npm test

      - name: Build full
        shell: bash -l {0}
        run: conda activate "$CONDA_ENV" && ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS.txt
            build-info.json
