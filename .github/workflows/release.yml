name: release

on:
  push:
    tags: ['v*']
 
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Setup conda with essentia
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          python-version: '3.10'
          channels: conda-forge
          channel-priority: strict
          activate-environment: essenv
          use-mamba: true
          miniforge-version: latest
      - name: Install essentia (conda-forge)
        shell: bash -l {0}
        run: mamba install -y -c conda-forge essentia

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Bootstrap (min)
        shell: bash -l {0}
        run: ./scripts/bootstrap.sh

      - name: Install deps & Test
        run: |
          npm ci
          npm test

      - name: Build full
        shell: bash -l {0}
        run: ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS.txt
            build-info.json
