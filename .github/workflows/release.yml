name: release

on:
  push:
    tags: ['v*']
 
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Install python3-essentia (apt) and verify
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-essentia python3-numpy
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("essentia")
          assert spec is not None, "python3-essentia not installed"
          import essentia
          print("essentia OK:", getattr(essentia, "__version__", "unknown"))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Bootstrap (min)
        run: ./scripts/bootstrap.sh

      - name: Install deps & Test
        run: |
          npm ci
          npm test

      - name: Build full
        run: ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS.txt
            build-info.json
