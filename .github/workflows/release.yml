name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.58

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl >/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          emcc -v || true
          which emcmake || true

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'v22.08' }}" >> $GITHUB_ENV

      - name: Print toolchain & ref
        run: |
          echo "ESSENTIA_JS_REF=$ESSENTIA_JS_REF"

      - name: Bootstrap (fetch + build min)
        run: ./scripts/bootstrap.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build full
        run: ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**
            build-info.json
