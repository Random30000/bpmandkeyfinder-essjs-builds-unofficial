name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Bootstrap (fetch + build min)
        run: |
          docker run --rm -t \
            -e EM_CACHE=/root/.emscripten_cache \
            -e EMCC_CORES=2 -e MAKEFLAGS="-j2" \
            -v "$PWD/.cache/emscripten":/root/.emscripten_cache \
            -v "$PWD":"$PWD" -w "$PWD" emscripten/emsdk:3.1.58 \
            bash -lc "set -euo pipefail; \
              apt-get update; \
              apt-get install -y git ca-certificates curl python3 python3-pip >/dev/null; \
              python3 -m pip install -U pip >/dev/null; \
              python3 -m pip install -q essentia || true; \
              git config --global --add safe.directory '$PWD'; \
              ./scripts/bootstrap.sh"

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build full
        run: |
          docker run --rm -t \
            -e EM_CACHE=/root/.emscripten_cache \
            -e EMCC_CORES=2 -e MAKEFLAGS="-j2" \
            -v "$PWD/.cache/emscripten":/root/.emscripten_cache \
            -v "$PWD":"$PWD" -w "$PWD" emscripten/emsdk:3.1.58 \
            bash -lc "set -euo pipefail; \
              apt-get update; \
              apt-get install -y git ca-certificates curl python3 python3-pip >/dev/null; \
              python3 -m pip install -U pip >/dev/null; \
              python3 -m pip install -q essentia || true; \
              git config --global --add safe.directory '$PWD'; \
              ./scripts/build.sh full"

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**
            build-info.json
