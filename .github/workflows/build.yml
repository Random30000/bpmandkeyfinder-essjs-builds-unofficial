name: build-test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Install python3-essentia (apt) and verify
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-essentia python3-numpy
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec("essentia")
          assert spec is not None, "python3-essentia not installed"
          import essentia
          print("essentia OK:", getattr(essentia, "__version__", "unknown"))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Bootstrap (fetch + build min)
        run: ./scripts/bootstrap.sh

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build (full)
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push' }}
        run: ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundles-${{ github.run_id }}
          path: |
            dist/*
            SHA256SUMS.txt
            build-info.json
