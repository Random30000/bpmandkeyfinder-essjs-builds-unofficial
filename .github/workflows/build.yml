name: build-test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Setup conda (mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
          use-mamba: true
          miniforge-version: latest

      - name: Install Essentia (conda-forge first, pip fallback)
        shell: bash -l {0}
        run: |
          set -euo pipefail

          # Ensure any previous environment is removed before attempting installs.
          conda env remove -n essenv >/dev/null 2>&1 || true

          for PY in 3.9 3.10 3.8; do
            echo "::group::conda-forge essentia on python=${PY}"
            if mamba create -y -n essenv -c conda-forge "python=${PY}"; then
              conda activate essenv
              if mamba install -y -c conda-forge essentia; then
                python - <<'PY'
                import essentia, sys
                print("essentia via conda OK", getattr(essentia, "__version__", "?"), "python", sys.version)
                PY
                echo "CONDA_ENV=essenv" >> "$GITHUB_ENV"
                echo "::endgroup::"
                exit 0
              fi
            fi
            conda deactivate >/dev/null 2>&1 || true
            conda env remove -n essenv >/dev/null 2>&1 || true
            echo "::endgroup::"
          done

          echo "::group::pip fallback build"
          mamba create -y -n essenv -c conda-forge python=3.10 cmake numpy cython pkg-config
          conda activate essenv
          sudo apt-get update
          sudo apt-get install -y build-essential libfftw3-dev libsamplerate0-dev libyaml-dev \
                               libavcodec-dev libavformat-dev libavutil-dev
          python -m pip install -U pip setuptools wheel
          pip install essentia
          python - <<'PY'
          import essentia, sys
          print("essentia via pip OK", getattr(essentia, "__version__", "?"), "python", sys.version)
          PY
          echo "CONDA_ENV=essenv" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Bootstrap (fetch + build min)
        shell: bash -l {0}
        run: conda activate "$CONDA_ENV" && ./scripts/bootstrap.sh

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build (full)
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push' }}
        shell: bash -l {0}
        run: conda activate "$CONDA_ENV" && ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundles-${{ github.run_id }}
          path: |
            dist/*
            SHA256SUMS.txt
            build-info.json
