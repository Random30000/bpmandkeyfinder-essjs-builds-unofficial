name: build-test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'v22.08' }}" >> $GITHUB_ENV

      - name: Print toolchain & ref
        run: |
          docker run --rm -t \
            -e EM_CACHE=/root/.emscripten_cache \
            -e EMCC_CORES=2 -e MAKEFLAGS="-j2" \
            -v "$PWD/.cache/emscripten":/root/.emscripten_cache \
            -v "$PWD":"$PWD" -w "$PWD" emscripten/emsdk:3.1.58 \
            bash -lc "set -euo pipefail; emcc -v || true"
          echo "ESSENTIA_JS_REF=$ESSENTIA_JS_REF"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Bootstrap (fetch upstream + build min)
        run: |
          docker run --rm -t \
            -e EM_CACHE=/root/.emscripten_cache \
            -e EMCC_CORES=2 -e MAKEFLAGS="-j2" \
            -v "$PWD/.cache/emscripten":/root/.emscripten_cache \
            -v "$PWD":"$PWD" -w "$PWD" emscripten/emsdk:3.1.58 \
            bash -lc "set -euo pipefail; \
              apt-get update; \
              apt-get install -y git ca-certificates curl python3 python3-pip >/dev/null; \
              python3 -m pip install -U pip >/dev/null; \
              python3 -m pip install -q essentia || true; \
              git config --global --add safe.directory '$PWD'; \
              ./scripts/bootstrap.sh"

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build (full) on default branch only
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push' }}
        run: |
          docker run --rm -t \
            -e EM_CACHE=/root/.emscripten_cache \
            -e EMCC_CORES=2 -e MAKEFLAGS="-j2" \
            -v "$PWD/.cache/emscripten":/root/.emscripten_cache \
            -v "$PWD":"$PWD" -w "$PWD" emscripten/emsdk:3.1.58 \
            bash -lc "set -euo pipefail; \
              apt-get update; \
              apt-get install -y git ca-certificates curl python3 python3-pip >/dev/null; \
              python3 -m pip install -U pip >/dev/null; \
              python3 -m pip install -q essentia || true; \
              git config --global --add safe.directory '$PWD'; \
              ./scripts/build.sh full"

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundles-${{ github.run_id }}
          path: |
            dist/**
            build-info.json
