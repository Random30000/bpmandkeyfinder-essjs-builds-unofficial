name: build-test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Setup conda (mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
          use-mamba: true
          miniforge-version: latest

      - name: Create env (py39) & install essentia
        shell: bash -l {0}
        run: |
          mamba create -n essenv -y python=3.9
          conda activate essenv
          mamba install -y -c conda-forge "essentia>=2.1,<2.2"
          python - <<'PY'
          import essentia, sys
          print("essentia OK", essentia.__version__)
          print("python", sys.executable)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Set upstream ref fallback
        run: echo "ESSENTIA_JS_REF=${{ vars.ESSENTIA_JS_REF || 'main' }}" >> $GITHUB_ENV

      - name: Bootstrap (fetch + build min)
        shell: bash -l {0}
        run: ./scripts/bootstrap.sh

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build (full)
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push' }}
        shell: bash -l {0}
        run: ./scripts/build.sh full

      - name: Hash & size
        run: node tools/hash.js && node tools/size-report.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundles-${{ github.run_id }}
          path: |
            dist/*
            SHA256SUMS.txt
            build-info.json
